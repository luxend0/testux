name: Catalog

on:
  push:
    paths:
      - "catalog/**"
      - "tools/check_catalog.py"
      - ".github/workflows/catalog.yml"
  pull_request:
    paths:
      - "catalog/**"
      - "tools/check_catalog.py"
      - ".github/workflows/catalog.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check catalog links and checksums
        run: python3 tools/check_catalog.py
