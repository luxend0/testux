name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  QT_VERSION: 6.8.3
  QT_QPA_PLATFORM: offscreen

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(sed -nE 's/^project\(Testux VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project(VERSION $version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    # The oldest supported runner keeps the AppImage's glibc requirement low enough for
    # Ubuntu 22.04, Mint 21 and Debian 12.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # GL/xkb headers for Qt6::Gui, the xcb libraries so linuxdeploy can bundle the
      # platform plugin's dependencies.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-12 \
            libgl-dev libegl-dev libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-12
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package AppImage
        run: packaging/linux/build-appimage.sh build "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: testux-linux
          path: dist/*.AppImage
          if-no-files-found: error